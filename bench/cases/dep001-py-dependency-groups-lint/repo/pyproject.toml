[project]
name = "billing"
version = "0.1.0"
description = "Billing webhooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "stripe>=11.4.1",
    "fastapi>=0.115.6",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    "pytest>=8.3.4",
]
lint = [
    "ruff>=0.8.4",
    "ruff-sqlalchemy-rules>=0.2.0",
]
