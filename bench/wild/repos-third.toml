# Third noise study (spec §8.4): 20 more repositories, pinned on 2026-10-09 before the
# second noise pass and before seamscan ran on them. Studies one and two (repos.toml,
# repos-fresh.toml) are development data for that pass; this set measures it.
#
# Same rule as repos.toml: the next qualifying results down the same searches.
# Changes forced by thin lists: "vite supabase" has no more repos with 5+ stars, so its
# two slots went to the next "nextjs supabase" results; "react firebase" had one more
# qualifying repo, so its other slot went to the next "nextjs firebase" result.
# Skipped: yuto514/HiyoRi-Ecommerce-Nextjs-Supabase (a copy of a repo already studied),
# hasgeek/coaster and UWUplus/flask-cloudflared (libraries), we45/Vulnerable-Flask-App
# (deliberately vulnerable; it would inflate the true findings), ydaniels/
# django-saas-billing and Experto-AI/quickscale (as before).

