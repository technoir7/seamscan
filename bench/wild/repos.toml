# Noise study corpus (spec §8.4): 20 public repositories at pinned commits.
#
# Selection rule, applied 2026-10-09 with `gh search repos "<query>" --sort stars`:
# take the top results that are applications or starter templates (not libraries,
# framework extensions or code generators), not forks, not archived, pushed since
# 2025-04-01, under 50 MB, and not one of the 24 repositories used while developing
# the rules (19 Lovable apps plus shadcn-ui/taxonomy, steven-tey/precedent,
# supabase-community/vercel-ai-chatbot, vercel/ai-chatbot,
# vercel/nextjs-subscription-payments).
#
# JavaScript/TypeScript: 3 x "nextjs supabase", 2 x "vite supabase" (5+ stars),
# 3 x "nextjs firebase", 2 x "react firebase".
# Judgment calls: tutorials count as apps; s3rius/FastAPI-template (a cookiecutter
# generator) and kmbhm1/supabase-pydantic (a library) were skipped; fireact-dev/main calls
# itself a SaaS framework but ships as a starter app, so it stayed in.
# Python: 2 x "fastapi template", 2 x "fastapi supabase", 3 x "flask app", 3 x "django saas".

