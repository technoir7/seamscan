[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seamscan"
version = "1.0.0"
description = "Catches open Supabase tables, open Firebase rules and leaked secrets in AI-built apps"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Aaron Fung"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tree-sitter==0.26.*",
    "tree-sitter-javascript==0.25.*",
    "tree-sitter-typescript==0.23.*",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pyright>=1.1.400",
    "jsonschema>=4.0",
]

[project.scripts]
seamscan = "seamscan.cli:main"

[tool.setuptools.package-data]
# Rule pages ship in the wheel so `seamscan explain` works offline after install.
"seamscan.rules" = ["docs/*.md"]
# The registry snapshot (ADR-004), with its README for the sources' attribution.
"seamscan.supply" = ["data/*.txt", "data/README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bench/cases", "bench/independent"]  # deliberately flawed sample code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes the bench/ package importable in tests

[tool.pyright]
include = ["src/seamscan", "bench"]
exclude = ["bench/cases", "bench/independent"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
